name: Sync SDK Compliance Matrix

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
    uses: supabase/sdk/.github/workflows/sync-sdk-compliance.yml@d9f43f5be4056adc33c65fe54f1c9ed1714d67e0
    with:
      # Keep in sync with supabase/sdk main; the reusable workflow's baked-in
      # default lagged behind a capability-ID rename (supabase/sdk#74) and
      # caused already-renamed IDs to be resynced as spurious "new" entries.
      sdk-ref: c73e9fa23d050b2d2e84a86574884a6b1e7434ff
    secrets:
      app-id: ${{ secrets.APP_ID }}
      private-key: ${{ secrets.PRIVATE_KEY }}
