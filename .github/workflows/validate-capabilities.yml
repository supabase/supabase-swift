name: Validate SDK Compliance

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  # Pull requests only validate when source or compliance files change. Pushes to main always run.
  changes:
    name: Detect changed paths
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      compliance: ${{ github.event_name != 'pull_request' || steps.filter.outputs.compliance }}
    steps:
      # Reads the PR's changed files from the API, so no checkout is needed.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            compliance:
              - Sources/**
              - Package.swift
              - Package@swift-*.swift
              - Package.resolved
              - Supabase.xcworkspace/**
              - scripts/**
              - tools/supabase-typegen/**
              - sdk-compliance.yaml
              - .sdk-parse-ignore
              - .github/workflows/validate-capabilities.yml

  validate:
    needs: changes
    if: needs.changes.outputs.compliance == 'true'
    uses: supabase/sdk/.github/workflows/validate-sdk-compliance-swift.yml@c5e199597c2ea682313854e7083cad05cfa203c1 # capability-matrix/v2.3.0
    with:
      runner: blacksmith-6vcpu-macos-latest
