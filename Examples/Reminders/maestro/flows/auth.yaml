appId: com.supabase.Reminders
env:
  EMAIL: auth-a@example.com
  PASSWORD: password123
---
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow: ../subflows/sign-up.yaml
- runFlow: ../subflows/sign-out.yaml

# A wrong password shows an error and stays on the Auth screen.
- tapOn:
    id: auth.email
- inputText: ${EMAIL}
- tapOn:
    id: auth.password
- inputText: wrong-password
- tapOn:
    id: auth.signIn
- extendedWaitUntil:
    visible:
      id: auth.error
    timeout: 15000
- assertNotVisible:
    id: home.accountMenu

# The right password signs in.
- tapOn:
    id: auth.password
- eraseText: 30
- inputText: ${PASSWORD}
- tapOn:
    id: auth.signIn
- runFlow: ../subflows/dismiss-save-password.yaml
- extendedWaitUntil:
    visible:
      id: home.accountMenu
    timeout: 15000

# The session is still there after a restart.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: home.accountMenu
    timeout: 15000
