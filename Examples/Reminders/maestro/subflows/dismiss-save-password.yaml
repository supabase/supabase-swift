# iOS asks to save the password after a sign-in or sign-up. The prompt covers the app.
# Ends on the Home screen.
#
# The prompt is not part of the app. Maestro finds its "Not Now" button by text on some
# runs only. When Home does not show, the flow taps the place of the button.
appId: com.supabase.Reminders
---
- tapOn:
    text: Not Now
    optional: true
- extendedWaitUntil:
    visible:
      id: home.accountMenu
    timeout: 8000
    optional: true
- runFlow:
    when:
      notVisible:
        id: home.accountMenu
    commands:
      - tapOn:
          point: 31%,62.5%
- extendedWaitUntil:
    visible:
      id: home.accountMenu
    timeout: 15000
