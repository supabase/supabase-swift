# Signs in and ends on the Home screen.
# Env: EMAIL, PASSWORD
appId: com.supabase.Reminders
---
- tapOn:
    id: auth.email
- inputText: ${EMAIL}
- tapOn:
    id: auth.password
- inputText: ${PASSWORD}
- tapOn:
    id: auth.signIn
# The "Save Password?" prompt can come late and cover the app. Try again if it did.
- retry:
    maxRetries: 2
    commands:
      - runFlow: dismiss-save-password.yaml
      - extendedWaitUntil:
          visible:
            id: home.accountMenu
          timeout: 15000
