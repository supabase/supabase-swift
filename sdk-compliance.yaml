sdk: swift

# Full declaration of all features from the supabase/sdk capability registry.
# See https://github.com/supabase/sdk for the canonical feature registry.

# JSONValue (formerly AnyJSON) is a JSON value type shared across Auth,
# PostgREST, Storage, and Realtime rather than owned by a single feature.
supporting_symbols:
  - JSONValue
  - JSONValue.init
  - JSONValue.decode
  - JSONValue.encode
  - JSONValue.decoder
  - JSONValue.encoder
  - JSONValue.null
  - JSONValue.bool
  - JSONValue.integer
  - JSONValue.double
  - JSONValue.string
  - JSONValue.object
  - JSONValue.array
  - JSONValue.value
  - JSONValue.isNil
  - JSONValue.boolValue
  - JSONValue.objectValue
  - JSONValue.arrayValue
  - JSONValue.stringValue
  - JSONValue.intValue
  - JSONValue.doubleValue
  - JSONValue.description
  - JSONValue.rawValue

  # A handful of PostgrestRequestBuilder members are used across many
  # database.* capabilities simultaneously (executing every query/mutate/rpc,
  # or acting as structural phase markers) rather than owned by a single
  # feature. Every other filter/modifier method is a 1:1 entry point for
  # exactly one capability and is attributed to that feature's own `symbols:`
  # list instead (see the database.* section below).
  # The typed-query contracts are in the same category: a relation type is used by
  # both the read and the write features rather than owned by one capability.
  - PostgrestClient.Configuration.accessToken
  - PostgrestExecutableBuilder
  - PostgrestExecutableBuilder.execute
  - PostgrestExecutablePhase
  - PostgrestFilterPhase
  - PostgrestFilterablePhase
  # Array-literal encoding. `PostgrestArrayElement` is the weaker of the two
  # filter protocols: a value that may appear inside a Postgres array literal,
  # including SQL NULL. It underpins every filter that takes an array
  # (contains/containedBy/overlaps) rather than belonging to one of them, and
  # it is what keeps `nil` out of the scalar comparison filters.
  - Array.postgrestArrayElement
  - JSONValue.postgrestArrayElement
  - Optional.postgrestArrayElement
  - PostgrestArrayElement
  - PostgrestArrayElement.postgrestArrayElement
  - PostgrestFilterValue.postgrestArrayElement
  - PostgrestKeyPathFilterable
  - PostgrestKeyPathFilterable.Phase
  - PostgrestKeyPathFilterable.Relation
  - PostgrestKeyPathFilterable.builder
  - PostgrestKeyPathFilterable.init
  - PostgrestKeyPathFilterable.where
  - PostgrestTypedMutation
  - PostgrestTypedMutation.Phase
  - PostgrestTypedMutation.Relation
  - PostgrestTypedMutation.builder
  - PostgrestTypedMutation.init
  - PostgrestTypedMutation.execute
  # The update payload is a set of column assignments rather than a row shape, which is what lets
  # a nullable column be cleared: a column is in the body because it was assigned, and `nil` is
  # sent as an explicit null. Shared by the typed update entry point and any caller that builds an
  # update ahead of time and hands it over.
  - PostgrestUpdate
  - PostgrestUpdate.init
  - PostgrestUpdate.isEmpty
  - PostgrestUpdate.subscript
  - PostgrestUpdate.encode
  - PostgrestQueryPhase
  - PostgrestRelation
  - PostgrestRelation.Columns
  - PostgrestRelation.columns
  - PostgrestRelation.columnName
  - PostgrestRelation.relationName
  - PostgrestRelation.schema
  - PostgrestKeyedRelation
  - PostgrestKeyedRelation.primaryKeyColumns
  - PostgrestRequestBuilder
  - PostgrestRequestBuilder.Operator
  - PostgrestRequestBuilder.execute
  - PostgrestRequestBuilder.explain
  - PostgrestRequestBuilder.fts
  - PostgrestRequestBuilder.fullTextSearch
  - PostgrestRequestBuilder.phraseToFullTextSearch
  - PostgrestRequestBuilder.plainToFullTextSearch
  - PostgrestRequestBuilder.setHeader
  - PostgrestRequestBuilder.webFullTextSearch
  - PostgrestSelection
  - PostgrestSelection.Source
  - PostgrestSelection.selectString
  - PostgrestTransformPhase
  - PostgrestTransformablePhase
  - PostgrestTypedQuery.Relation
  - PostgrestWritableRelation
  - PostgrestWritableRelation.Draft

  # The typed column-expression surface. A column expression is the left-hand side of every
  # filter, every `order` key and every `select` entry at once, so none of these types belongs to
  # a single capability. The operator methods declared over them are 1:1 with a capability and are
  # attributed to that feature's own `symbols:` list instead (see database.using_filters.*
  # below); `asc()`/`desc()` likewise, under database.using_modifiers.order.
  #
  # The position refinements are rules enforced by the type system rather than by the server: the
  # base protocol is select position, `PostgrestFilterableExpression` adds the left of a filter,
  # `PostgrestOrderableExpression` adds an `order` key. `PostgrestNullableExpression` is not a
  # position but a nullability refinement, and it is where `isNull()` lives so that any future
  # nullable expression gets the operator by conforming rather than by redeclaring it.
  - PostgrestColumnExpression
  - PostgrestColumnExpression.Root
  - PostgrestColumnExpression.Value
  - PostgrestColumnExpression.postgrestExpression
  - PostgrestFilterableExpression
  - PostgrestOrderableExpression
  - PostgrestNullableExpression
  # One stored-column struct with a nullability phantom, plus the two aliases callers and the
  # generator spell it as. The members are on the struct, so they are registered there.
  - PostgrestStoredColumn
  - PostgrestStoredColumn.init
  - PostgrestStoredColumn.postgrestExpression
  - PostgrestColumn
  - PostgrestNullableColumn
  - PostgrestNullability
  - PostgrestNotNull
  - PostgrestNullable
  # The filter value itself, and the AND junction. `||` and `!` map onto
  # database.using_filters.or and .not; `&&` has no capability of its own — PostgREST ANDs
  # top-level query parameters already, so conjunction is the default rather than a feature — and
  # sits here instead of being attributed to a capability it does not implement.
  - PostgrestFilter
  - "&&"

  # The `PostgrestMacros` attributes. `@Table` synthesizes the relation
  # conformance used by every database.* typed entry point, and the three
  # markers are inputs to that one expansion rather than capabilities of their
  # own. Attribute names are unprefixed on purpose — nothing re-exports
  # `PostgrestMacros`, so a user opts in with an explicit import.
  - Table
  - SelectionOf
  - Column
  - PrimaryKey
  - Default

