sdk: swift

# Full declaration of all features from the supabase/sdk capability registry.
# See https://github.com/supabase/sdk for the canonical feature registry.

# JSONValue (formerly AnyJSON) is a JSON value type shared across Auth,
# PostgREST, Storage, and Realtime rather than owned by a single feature.
supporting_symbols:
  - JSONValue
  - JSONValue.init
  - JSONValue.decode
  - JSONValue.encode
  - JSONValue.decoder
  - JSONValue.encoder
  - JSONValue.null
  - JSONValue.bool
  - JSONValue.integer
  - JSONValue.double
  - JSONValue.string
  - JSONValue.object
  - JSONValue.array
  - JSONValue.value
  - JSONValue.isNil
  - JSONValue.boolValue
  - JSONValue.objectValue
  - JSONValue.arrayValue
  - JSONValue.stringValue
  - JSONValue.intValue
  - JSONValue.doubleValue
  - JSONValue.description
  - JSONValue.rawValue

  # The injected clock is a testability seam shared across Auth's token auto-refresh and
  # request-retry backoff and Realtime's heartbeat timer and reconnect backoff, rather than a
  # capability any one feature implements. `SupabaseClient` forwards `GlobalOptions.clock` to the
  # per-sub-client properties, so all three spell the same knob at a different layer.
  - SupabaseClientOptions.GlobalOptions.clock
  - AuthClient.Configuration.clock
  - RealtimeClientOptions.clock
  # A per-module logger override on the facade, mirroring `GlobalOptions.logger`; a logging
  # knob, not a capability.
  - SupabaseClientOptions.FunctionsOptions.logger

  # A handful of PostgrestRequestBuilder members are used across many
  # database.* capabilities simultaneously (executing every query/mutate/rpc,
  # or acting as structural phase markers) rather than owned by a single
  # feature. Every other filter/modifier method is a 1:1 entry point for
  # exactly one capability and is attributed to that feature's own `symbols:`
  # list instead (see the database.* section below).
  - PostgrestExecutableBuilder
  - PostgrestExecutableBuilder.execute
  - PostgrestExecutablePhase
  - PostgrestFilterPhase
  - PostgrestFilterablePhase
  # Array-literal encoding. `PostgrestArrayElement` is the weaker of the two
  # filter protocols: a value that may appear inside a Postgres array literal,
  # including SQL NULL. It underpins every filter that takes an array
  # (contains/containedBy/overlaps) rather than belonging to one of them, and
  # it is what keeps `nil` out of the scalar comparison filters.
  - Array.postgrestArrayElement
  - JSONValue.postgrestArrayElement
  - Optional.postgrestArrayElement
  - PostgrestArrayElement
  - PostgrestArrayElement.postgrestArrayElement
  - PostgrestFilterValue.postgrestArrayElement
  - PostgrestQueryPhase
  - PostgrestRequestBuilder
  - PostgrestRequestBuilder.Operator
  - PostgrestRequestBuilder.execute
  - PostgrestRequestBuilder.explain
  - PostgrestRequestBuilder.fts
  - PostgrestRequestBuilder.fullTextSearch
  - PostgrestRequestBuilder.phraseToFullTextSearch
  - PostgrestRequestBuilder.plainToFullTextSearch
  - PostgrestRequestBuilder.setHeader
  - PostgrestRequestBuilder.webFullTextSearch
  - PostgrestTransformPhase
  - PostgrestTransformablePhase

  # The typed query API is experimental. Every type it declares is `_`-prefixed (`_PostgrestRelation`,
  # `_PostgrestQuery`, …), and its entry points (`from<R>(_:)`, `schema<S>(_:)`) are
  # `@_spi(Experimental)`. The public symbol graph the compliance scanner reads holds neither, so
  # those symbols are not listed here or under the database.* features: the features keep their
  # status through the string builder's symbols. What remains visible is the AND junction: `||`
  # and `!` map onto database.using_filters.or and .not; `&&` has no capability of its own —
  # PostgREST ANDs top-level query parameters already, so conjunction is the default rather than a
  # feature — and sits here instead of being attributed to a capability it does not implement.
  - "&&"

  # The `PostgrestMacros` attributes. `@Table` synthesizes the relation
  # conformance used by every database.* typed entry point, and the four
  # markers are inputs to that one expansion rather than capabilities of their
  # own. Attribute names are unprefixed on purpose — nothing re-exports
  # `PostgrestMacros`, so a user opts in with an explicit import.
  - Table
  - SelectionOf
  - Column
  - PrimaryKey
  - Default
  - Generated
  - Relationship
  - Aggregate
  # Error root shared by every module error (SDK-1788). Each module's error
  # struct conforms to SupabaseError and carries the failed HTTP response as an
  # HTTPErrorResponse, so one catch clause serves the whole SDK. The
  # sb-request-id header name is exposed for callers that read it directly.
  - SupabaseError
  - SupabaseError.message
  - SupabaseError.response
  - SupabaseError.underlyingError
  - SupabaseError.errorDescription
  - HTTPErrorResponse
  - HTTPErrorResponse.init
  - HTTPErrorResponse.statusCode
  - HTTPErrorResponse.headers
  - HTTPErrorResponse.body
  - HTTPErrorResponse.requestID
  - HTTPField.Name.sbRequestID
  # FunctionsError (SDK-1788) is thrown by every functions.* capability rather
  # than owned by one.
  - FunctionsError
  - FunctionsError.Kind
  - FunctionsError.Kind.init
  - FunctionsError.Kind.rawValue
  - FunctionsError.Kind.relay
  - FunctionsError.Kind.server
  - FunctionsError.Kind.transport
  - FunctionsError.Kind.decoding
  - FunctionsError.init
  - FunctionsError.kind
  - FunctionsError.message
  - FunctionsError.response
  - FunctionsError.underlyingError
  - FunctionsError.description
  # StorageError (SDK-1788) is thrown by every storage.* capability rather than
  # owned by one. ServerError is the decoded Storage error payload.
  - StorageError
  - StorageError.Kind
  - StorageError.Kind.init
  - StorageError.Kind.rawValue
  - StorageError.Kind.server
  - StorageError.Kind.transport
  - StorageError.Kind.decoding
  - StorageError.Kind.invalidRequest
  - StorageError.ServerError
  - StorageError.ServerError.init
  - StorageError.ServerError.statusCode
  - StorageError.ServerError.error
  - StorageError.ServerError.message
  - StorageError.ServerError.code
  - StorageError.code
  - StorageError.serverStatusCode
  - StorageError.isNotFound
  - StorageError.init
  - StorageError.kind
  - StorageError.message
  - StorageError.serverError
  - StorageError.response
  - StorageError.underlyingError
  - StorageError.description
  # PostgrestError (SDK-1788) is thrown by every database.* capability rather
  # than owned by one. ServerError is the decoded PostgREST error payload.
  - PostgrestError
  - PostgrestError.Kind
  - PostgrestError.Kind.init
  - PostgrestError.Kind.rawValue
  - PostgrestError.Kind.server
  - PostgrestError.Kind.transport
  - PostgrestError.Kind.decoding
  - PostgrestError.Kind.invalidRequest
  - PostgrestError.Kind.accessToken
  - PostgrestError.ServerError
  - PostgrestError.ServerError.init
  - PostgrestError.ServerError.code
  - PostgrestError.ServerError.message
  - PostgrestError.ServerError.details
  - PostgrestError.ServerError.hint
  - PostgrestError.init
  - PostgrestError.kind
  - PostgrestError.message
  - PostgrestError.serverError
  - PostgrestError.response
  - PostgrestError.underlyingError
  - PostgrestError.description
  # AuthError (SDK-1788) is thrown by every auth.* capability rather than owned
  # by one. ErrorCode values are attributed to their features below.
  - AuthError
  - AuthError.Kind
  - AuthError.Kind.init
  - AuthError.Kind.rawValue
  - AuthError.Kind.server
  - AuthError.Kind.sessionMissing
  - AuthError.Kind.refreshDiscarded
  - AuthError.Kind.oauthFlowFailed
  - AuthError.Kind.jwtVerificationFailed
  - AuthError.Kind.transport
  - AuthError.Kind.decoding
  - AuthError.init
  - AuthError.kind
  - AuthError.message
  - AuthError.errorCode
  - AuthError.weakPasswordReasons
  - AuthError.response
  - AuthError.underlyingError
  - AuthError.description
  - AuthError.sessionMissing
  - AuthError.refreshDiscarded
  # AuthAdmin.init (SDK-1983) creates the standalone admin client that every
  # auth.admin.* capability runs on, rather than belonging to one of them.
  - AuthAdmin.init
  # The admin MFA namespace is shared by auth.admin.list_mfa_factors and
  # auth.admin.delete_mfa_factor rather than owned by one.
  - AuthAdmin.mfa
